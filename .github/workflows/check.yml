name: Fieldbook
on:
  push:
  pull_request:
jobs:
  examples-and-docs:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "cpg2unstructured[fast] @ git+https://github.com/arturcastiel/cpg2python.git@7d98aebbd64b03ee4623cf0c97e01dd19cda9f5b"
      # fault-projections is private: clone it with a read-only token
      # (secret FAULT_PROJECTIONS_TOKEN). The URL rewrite lives only in this
      # step's environment, so the token never reaches pip or disk.
      - name: Install fault-projections (private)
        shell: bash
        env:
          FP_TOKEN: ${{ secrets.FAULT_PROJECTIONS_TOKEN }}
        run: |
          if [ -z "$FP_TOKEN" ]; then
            echo "::error::Secret FAULT_PROJECTIONS_TOKEN is not set (read-only token for arturcastiel/fault-projections, see README)."
            exit 1
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${FP_TOKEN}@github.com/arturcastiel/fault-projections.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/arturcastiel/fault-projections"
          python -m pip install "fault-projections @ git+https://github.com/arturcastiel/fault-projections.git@247507e70be854bbc18d6b02c27efeb59f998149"
      - run: python -m pip install -e ".[test,docs]"
      - run: python -m fieldbook.cli doctor
      - run: python -m pytest -q
      - run: python -m fieldbook.docs --check
      - run: python -m fieldbook.docs
