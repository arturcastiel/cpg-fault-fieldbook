name: Fieldbook
on:
  push:
  pull_request:
jobs:
  examples-and-docs:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "cpg2unstructured[fast] @ git+https://github.com/arturcastiel/cpg2python.git@e4637ccedf82c82f5c081bb909b354a7b919c6be"
      - run: python -m pip install "fault-projections @ git+https://github.com/arturcastiel/fault-projections.git@0837f07dd97961d2e5e92b26fd0dea7f7d8e3291"
      - run: python -m pip install -e ".[test,docs]"
      - run: python -m fieldbook.cli doctor
      - run: python -m pytest -q
      - run: python -m fieldbook.docs --check
      - run: python -m fieldbook.docs
